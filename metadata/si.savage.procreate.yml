Description: 'Procreate is the premier creative studio loved by millions of digital
  artists and illustrators. Packaged and converted for Android devices using the IOSonDroid
  standalone compatibility engine.


  Features:

  * Ultra-high definition canvases and responsive touch sketching

  * Advanced Valkyrie brush engine with customizable pressure curve

  * Full layer system with 25 layer blend modes and clipping masks

  * Continuous autosave so you never lose your artwork

  * Bluetooth stylus pressure and tilt sensitivity support

  * Comprehensive export formats (PSD, TIFF, transparent PNG, multi-page PDF)

  * 4K time-lapse recording and replay support'
